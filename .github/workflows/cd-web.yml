name: CD — Web

# Gated on the CI workflow ("name: CI" in ci.yml) finishing successfully on
# main, not a plain push — a red CI run must not trigger a deploy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Vercel
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Deploy the exact commit CI validated, not whatever main points to by
      # the time this job starts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Deliberately no working-directory here (removed — see git history):
      # the Vercel project's own Root Directory setting is already "web"
      # (set via `vercel link` from web/ on Day 33), so running this step
      # from web/ too made the CLI look for web/web and fail with "The
      # provided path web/web does not exist". Running from the repo root
      # lets Vercel's Root Directory setting resolve web/ on its own.
      #
      # `vercel deploy` (no --prebuilt) builds from source in Vercel's own
      # cloud infra using web/vercel.json + detected framework — no local
      # `npm ci`/`vite build` step needed, VITE_API_URL_PROD reaches that
      # cloud build via --build-env instead.
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL_PROD: ${{ secrets.VITE_API_URL_PROD }}
        run: npx vercel@latest deploy --prod --yes --build-env VITE_API_URL="$VITE_API_URL_PROD"
