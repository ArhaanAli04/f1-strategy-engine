name: Load Test

# Manually triggered against a real staging (or later, production) deployment
# — workflow_dispatch only, never runs automatically.
#
# session_id is a third input beyond the original two-input spec
# (staging_url, users): backend/tests/load/locustfile.py's @events.test_start
# handler hard-fails via _env_or_raise("LOAD_TEST_SESSION_ID") if that env
# var isn't set, so a session id has to come from somewhere for this workflow
# to actually complete a run. See locustfile.py's module docstring for what
# LOAD_TEST_SESSION_ID needs to point at (a real session UUID with ingested
# lap_data).
#
# Required GitHub Secret: SLACK_WEBHOOK_DEPLOY (results are posted to
# #deploy-alerts, same channel as cd.yml).

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "URL to test against (e.g. https://staging.f1-strategy-engine.internal)"
        required: true
        type: string
      users:
        description: "Number of concurrent simulated users"
        required: true
        default: "100"
        type: choice
        options:
          - "100"
          - "500"
      session_id:
        description: "Real session UUID with ingested lap_data (LOAD_TEST_SESSION_ID)"
        required: true
        type: string

jobs:
  load-test:
    name: Run Locust load test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Locust
        env:
          LOAD_TEST_SESSION_ID: ${{ inputs.session_id }}
        run: |
          locust -f backend/tests/load/locustfile.py --headless --only-summary \
            -u ${{ inputs.users }} -r 10 --run-time 2m \
            --host "${{ inputs.staging_url }}" \
            2>&1 | tee locust_output.log

      - name: Capture summary
        if: always()
        id: summary
        run: |
          {
            echo "summary<<LOCUST_SUMMARY_EOF"
            tail -n 60 locust_output.log
            echo "LOCUST_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_DEPLOY: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
        run: |
          PAYLOAD=$(jq -n \
            --arg status "${{ job.status }}" \
            --arg url "${{ inputs.staging_url }}" \
            --arg users "${{ inputs.users }}" \
            --arg summary "${{ steps.summary.outputs.summary }}" \
            '{text: ":bar_chart: *Load test (\($status))* against `\($url)` with \($users) users\n```\($summary)```"}')
          curl -sf -X POST "$SLACK_WEBHOOK_DEPLOY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
