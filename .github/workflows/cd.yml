name: CD

# Runs only when commits land on main (i.e. after a PR merge) — never on
# feature branches and never on pull_request events. Contrast with ci.yml,
# which runs on every branch push and every PR into main.
#
# Required GitHub Secrets (must exist before this workflow can succeed):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   ECR_REGISTRY, ECR_BACKEND_REPO, ECR_WORKER_REPO
#   SLACK_WEBHOOK_DEPLOY
#
# Jobs 2-5 are intentionally structured as an echo placeholder + a commented
# real command, so the real command can drop in on its scheduled day without
# restructuring this file.
#
# Day 22 built and validated infra/helm-chart/ against a local Docker
# Desktop Kubernetes cluster only (see DEPLOYMENT.md's "Local Kubernetes
# Deployment" section) — no cloud cluster exists yet, and which one
# (EKS/GKE/Render, see DEPLOYMENT.md's "Future Cloud Deployment") is still
# an open decision. Jobs 3-5 below stay deferred until that decision is
# made and a real cluster/kubeconfig exists.
#
# cosign image signing is deferred until a real cloud cluster exists (an
# admission-time verification target) — no signing step below yet.

on:
  push:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_BACKEND_REPO: ${{ secrets.ECR_BACKEND_REPO }}
  ECR_WORKER_REPO: ${{ secrets.ECR_WORKER_REPO }}

jobs:
  build-and-push:
    name: Build and push images to ECR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build backend image
        run: |
          docker build -f infra/docker/Dockerfile.backend \
            -t "$ECR_REGISTRY/$ECR_BACKEND_REPO:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$ECR_BACKEND_REPO:latest" \
            .

      - name: Build worker image
        run: |
          docker build -f infra/docker/Dockerfile.worker \
            -t "$ECR_REGISTRY/$ECR_WORKER_REPO:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$ECR_WORKER_REPO:latest" \
            .

      - name: Push backend image
        run: |
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPO:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPO:latest"

      - name: Push worker image
        run: |
          docker push "$ECR_REGISTRY/$ECR_WORKER_REPO:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_WORKER_REPO:latest"

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_DEPLOY: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
        run: |
          PAYLOAD=$(jq -n \
            --arg sha "${{ github.sha }}" \
            --arg backend_repo "$ECR_BACKEND_REPO" \
            --arg worker_repo "$ECR_WORKER_REPO" \
            '{text: ":white_check_mark: *CD build-and-push succeeded* — images pushed for commit `\($sha)` (backend: `\($backend_repo):\($sha)`, worker: `\($worker_repo):\($sha)`)."}')
          curl -sf -X POST "$SLACK_WEBHOOK_DEPLOY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

