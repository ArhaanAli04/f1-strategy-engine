  deploy-production:
    name: Deploy to production (Fly.io)
    needs: [load-test-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production (deferred)
        run: echo "Production deploy deferred — target is Fly.io (decided Day 24), not Kubernetes/EKS; real deploy lands after Day 40"
