    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Load test staging (deferred)
        run: echo "Load test deferred — no staging URL yet; deploy-staging remains an echo placeholder until a cloud cluster exists (see DEPLOYMENT.md)"
        # TODO: once deploy-staging is real, trigger load-test.yml against
