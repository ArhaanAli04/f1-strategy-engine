name: Train Models

# Weekly incremental retraining of all 7 F1 strategy ML models
# (backend/scripts/retrain_incremental.py), plus manual on-demand runs.
#
# The runner has no local Postgres and no FastF1 cache. retrain_incremental.py
# needs no DB at all: it downloads the static 2018-2025 base training corpus
# from S3 (see the one-time export_training_data.py step documented in
# CLAUDE.md's Deferred Wiring & Integration Gaps) and fetches the current
# season's completed rounds directly from FastF1. Run that export once before
# triggering this workflow manually for the first time.
#
# Promotion is decided per-model (see retrain_incremental.py's module
# docstring) — a single run can promote some of the 7 models to the
# 'production' S3 tag and leave others at 'candidate' awaiting human review.
# This workflow branches on each outcome independently via
# retrain_summary.json, not as one run-level verdict.
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION (already set — Day 19/20)
#   SLACK_WEBHOOK_DEPLOY (same channel as cd.yml / load-test.yml, #deploy-alerts)

on:
  workflow_dispatch: {}
  # Enabled Day 24: Supabase is configured (Day 23) and the one-time
  # export_training_data.py run uploaded the base corpus to S3 (completed
  # 2026-07-30 — see CLAUDE.md's Notes). Runs every Monday 02:00 UTC.
  schedule:
    - cron: "0 2 * * 1"

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: ${{ secrets.AWS_REGION }}

permissions:
  contents: write
  issues: write

jobs:
  retrain:
    name: Incremental retrain + promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # python:3.11-slim (the runtime image) strips libgomp1, which lightgbm
      # dlopen()s at import time (see CLAUDE.md's libgomp1 note). ubuntu-latest
      # carries it via build-essential already, but pin the install here too,
      # matching ci.yml's unit-tests/integration-tests/e2e-tests jobs.
      - name: Install libgomp1
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run incremental retraining
        run: python -m backend.scripts.retrain_incremental

      - name: Upload training summary + models artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-summary
          path: |
            retrain_summary.json
            models/
          if-no-files-found: ignore

      - name: Summarize promoted vs candidate models
        id: summary
        run: |
          {
            echo "promoted<<PROMOTED_EOF"
            jq -r 'to_entries[] | select(.value.promoted == true) |
              "- \(.key): holdout_mae=\(.value.holdout_mae) (previous production: \(.value.previous_production_holdout_mae // "none"))"' \
              retrain_summary.json
            echo "PROMOTED_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "candidates<<CANDIDATES_EOF"
            jq -r 'to_entries[] | select(.value.promoted == false) |
              "- \(.key): holdout_mae=\(.value.holdout_mae) (current production: \(.value.previous_production_holdout_mae // "none"))"' \
              retrain_summary.json
            echo "CANDIDATES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "has_promoted=$(jq '[to_entries[] | select(.value.promoted == true)] | length > 0' retrain_summary.json)" >> "$GITHUB_OUTPUT"
          echo "has_candidates=$(jq '[to_entries[] | select(.value.promoted == false)] | length > 0' retrain_summary.json)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release for promoted model(s)
        if: steps.summary.outputs.has_promoted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="models-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "Model retrain $TAG" \
            --notes "$(printf 'Promoted to the production S3 tag this run:\n\n%s' "${{ steps.summary.outputs.promoted }}")"

      - name: Notify Slack — model(s) promoted
        if: steps.summary.outputs.has_promoted == 'true'
        env:
          SLACK_WEBHOOK_DEPLOY: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
        run: |
          PAYLOAD=$(jq -n \
            --arg body "${{ steps.summary.outputs.promoted }}" \
            '{text: ":white_check_mark: *Weekly retrain promoted model(s) to production*\n\($body)"}')
          # Informational only — a Slack delivery failure must never fail a
          # job whose actual work (promotion) already succeeded. No -f:
          # curl exits 0 on a non-2xx response too; the || true also covers
          # client-side failures (e.g. a malformed/empty webhook URL).
          curl -s -X POST "$SLACK_WEBHOOK_DEPLOY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            || echo "::warning::Slack notification failed — check SLACK_WEBHOOK_DEPLOY"

      - name: Open review issue for candidate model(s)
        if: steps.summary.outputs.has_candidates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Model retrain $(date -u +%Y-%m-%d): candidate model(s) awaiting review" \
            --body "$(printf 'The following model(s) did not improve on the current production holdout MAE this run and were uploaded as `:candidate` only. Review and promote manually if appropriate — see docs/runbook.md '\''Promoting a candidate model'\'' section.\n\n%s' "${{ steps.summary.outputs.candidates }}")"

      - name: Notify Slack — review needed
        if: steps.summary.outputs.has_candidates == 'true'
        env:
          SLACK_WEBHOOK_DEPLOY: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
        run: |
          PAYLOAD=$(jq -n \
            --arg body "${{ steps.summary.outputs.candidates }}" \
            '{text: ":warning: *Weekly retrain: candidate model(s) awaiting human review*\n\($body)"}')
          # Informational only — see "Notify Slack — model(s) promoted"
          # above for why this must not fail the job.
          curl -s -X POST "$SLACK_WEBHOOK_DEPLOY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            || echo "::warning::Slack notification failed — check SLACK_WEBHOOK_DEPLOY"
