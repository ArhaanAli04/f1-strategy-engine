name: Ingest Historical

# Manually-triggered historical FastF1 ingestion directly into the Supabase
# production DB (backend/scripts/ingest_historical.py — writes lap_data/
# tire_stints only, no Celery/live-pipeline involvement, see that script's
# module docstring). Run this after each 2026 race weekend to keep
# production current for the deployed web app, and before train-models.yml
# so the weekly retrain sees the new round — see docs/runbook.md.
#
# Required GitHub Secrets:
#   SUPABASE_DIRECT_URL (Day 23 — session-mode pooler URL, port 5432; same
#     secret cd.yml's migrate job uses, same postgresql:// -> +asyncpg
#     conversion — see that job's comment for why session mode, not the
#     transaction pooler on port 6543)
#   SLACK_WEBHOOK_DEPLOY (same channel as cd.yml / train-models.yml,
#     #deploy-alerts)

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year"
        type: string
        default: "2026"
      round:
        description: "Round number (1-24)"
        type: string
        required: true
      session_type:
        description: "Session type: R, Q, FP1, FP2, or FP3"
        type: string
        default: "R"

jobs:
  ingest:
    name: Ingest historical session into Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Run ingest_historical.py
        env:
          # Same conversion cd.yml's migrate job uses — the secret stores a
          # bare postgresql:// URL, DatabaseSettings needs the asyncpg driver
          # scheme. TIMESCALE_URL is required by DatabaseSettings even though
          # this script never queries it, pointed at the same DB (matches
          # local .env's convention and cd.yml's migrate job).
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          ASYNC_URL="${SUPABASE_DIRECT_URL/postgresql:\/\//postgresql+asyncpg:\/\/}"
          export DATABASE_URL="$ASYNC_URL"
          export TIMESCALE_URL="$ASYNC_URL"
          python -m backend.scripts.ingest_historical \
            --season "${{ inputs.season }}" \
            --round "${{ inputs.round }}" \
            --session-type "${{ inputs.session_type }}"

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_DEPLOY: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
        run: |
          PAYLOAD=$(jq -n \
            --arg season "${{ inputs.season }}" \
            --arg round "${{ inputs.round }}" \
            --arg session_type "${{ inputs.session_type }}" \
            '{text: ":white_check_mark: *Ingest Historical succeeded* — season `\($season)` round `\($round)` (`\($session_type)`) ingested into Supabase production DB."}')
          # Informational only — see cd.yml's build-and-push Notify Slack
          # step for why this must not fail the job on a Slack delivery
          # failure. No -f: curl exits 0 on a non-2xx response too; the
          # || fallback also covers client-side failures (e.g. a
          # malformed/empty webhook URL) that -f wouldn't have caught anyway.
          curl -s -X POST "$SLACK_WEBHOOK_DEPLOY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            || echo "::warning::Slack notification failed — check SLACK_WEBHOOK_DEPLOY"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_DEPLOY: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
        run: |
          PAYLOAD=$(jq -n \
            --arg season "${{ inputs.season }}" \
            --arg round "${{ inputs.round }}" \
            --arg session_type "${{ inputs.session_type }}" \
            '{text: ":x: *Ingest Historical failed* — season `\($season)` round `\($round)` (`\($session_type)`) did not complete. Supabase production DB may be missing this round."}')
          curl -s -X POST "$SLACK_WEBHOOK_DEPLOY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            || echo "::warning::Slack notification failed — check SLACK_WEBHOOK_DEPLOY"
