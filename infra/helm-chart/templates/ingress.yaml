{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "f1-strategy-engine.fullname" . }}
  labels:
    {{- include "f1-strategy-engine.labels" . | nindent 4 }}
  annotations:
    # WebSocket support: nginx passes through the client's Upgrade header
    # automatically, but the timeouts must be raised well past nginx's 60s
    # default or long-lived WS connections (telemetry.py's per-session
    # broadcaster) get killed mid-stream.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # TLS annotation is always present so the chart's shape is ready for a
    # real cluster — locally there is no ingress-nginx controller and no
    # cert-manager, so this stays inert regardless (see values.local.yaml).
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "f1-strategy-engine.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
{{- end }}
