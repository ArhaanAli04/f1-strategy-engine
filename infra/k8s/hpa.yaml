# Backend HorizontalPodAutoscaler — written Day 21, applied Day 22 once the
# EKS/Docker Desktop Kubernetes cluster and Helm chart exist. Do NOT apply
# today; there is no cluster yet.
#
# Deployment name (f1-strategy-engine-backend) is a placeholder matching
# cd.yml's Helm release name (f1-strategy-engine) + "-backend" — confirm and
# update against the actual generated resource name once the Helm chart
# (infra/k8s/helm/, referenced in cd.yml's deferred deploy-staging/
# deploy-production steps) is written on Day 22.
#
# The custom metric (f1_active_websocket_connections, backend/core/metrics.py)
# requires prometheus-adapter installed and configured to expose it via the
# Kubernetes custom.metrics.k8s.io API — not installed yet. Until then this
# HPA's CPU rule alone is enough for `kubectl apply --dry-run=client` schema
# validation; the Pods metric rule will only take effect once the adapter
# exists.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: f1-strategy-engine-backend
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: f1-strategy-engine-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Pods
      pods:
        metric:
          name: f1_active_websocket_connections
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      # Race day traffic arrives as a step change at each session's green
      # light (see docs/runbook.md's Race Day Scaling Procedure) — scale up
      # fast rather than the default gradual ramp.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      # Scale down slowly — avoid flapping between sessions when viewer
      # count dips briefly (e.g. a red flag).
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
