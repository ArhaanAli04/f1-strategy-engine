# Race weekend pre-scaling CronJob — written Day 21, applied Day 22 once the
# EKS/Docker Desktop Kubernetes cluster and Helm chart exist. Do NOT apply
# today; there is no cluster yet.
#
# Session start times vary weekend-to-weekend, so a single fixed `schedule:`
# cron expression can't itself mean "30 min before the next session" — this
# CronJob instead runs frequently (every 10 minutes) and each run checks the
# Ergast-resolved calendar (fastf1.ergast.Ergast().get_race_schedule(), the
# same wrapper race_service.py already uses — see CLAUDE.md's note that raw
# HTTP to ergast.com has been dead since 2024) for whether any session starts
# within the next 30 minutes; if so, it scales the backend Deployment to 5
# replicas, otherwise it's a no-op. Scaling back down after a session ends is
# handled by the HPA's own scaleDown behavior (infra/k8s/hpa.yaml) once
# viewer-driven traffic (f1_active_websocket_connections) drops, not by this
# CronJob.
#
# The actual session-time-check script (backend/scripts/prescale_for_session.py,
# referenced below) is a Day 22 implementation detail — this manifest wires
# the CronJob's shape, schedule, and RBAC permissions so the real command can
# drop in on Day 22 without restructuring this file (same pattern cd.yml's
# Jobs 2-5 already use for their deferred steps).
#
# Deployment name (f1-strategy-engine-backend) is a placeholder matching
# cd.yml's Helm release name (f1-strategy-engine) + "-backend" — confirm and
# update against the actual generated resource name once the Helm chart is
# written on Day 22.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: f1-strategy-engine-race-scaler
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: f1-strategy-engine-race-scaler
  namespace: production
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: ["f1-strategy-engine-backend"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: f1-strategy-engine-race-scaler
  namespace: production
subjects:
  - kind: ServiceAccount
    name: f1-strategy-engine-race-scaler
    namespace: production
roleRef:
  kind: Role
  name: f1-strategy-engine-race-scaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: f1-strategy-engine-race-weekend-prescale
  namespace: production
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: f1-strategy-engine-race-scaler
          restartPolicy: Never
          containers:
            - name: race-weekend-prescale
              # Placeholder image ref — Day 22 should point this at the same
              # ECR backend image cd.yml builds/pushes, so this script ships
              # with the rest of backend/scripts/ rather than a separate image.
              image: "${ECR_REGISTRY}/${ECR_BACKEND_REPO}:latest"
              # TODO Day 22: implement backend/scripts/prescale_for_session.py
              # (checks Ergast calendar, scales f1-strategy-engine-backend to
              # 5 replicas if any session starts within --lead-minutes).
              command:
                - python
                - -m
                - backend.scripts.prescale_for_session
                - --lead-minutes
                - "30"
                - --replicas
                - "5"
                - --deployment
                - f1-strategy-engine-backend
                - --namespace
                - production
